<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>Issue / Return - Library Management</title>

  <style>

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f6f8;
    }

    header {
        background: #1f416b;
        color: white;
        padding: 35px 60px;
    }

    header h1 {
        margin: 0;
        font-size: 36px;
    }

    .container {
        width: 85%;
        margin: 40px auto;
    }

    .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    h2 {
        color: #1f416b;
    }

    .card {
        background: white;
        padding: 25px;
        margin-top: 25px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    label {
        font-weight: bold;
        margin-right: 10px;
    }

    select,
    input {
        padding: 10px;
        margin-right: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button,
    .button {
        background: #1f416b;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
    }

    button:hover,
    .button:hover {
        background: #163452;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 25px;
    }

    th {
        background: #1f416b;
        color: white;
        padding: 14px;
        text-align: left;
    }

    td {
        padding: 14px;
        border-bottom: 1px solid #ddd;
    }

    .returned {
        color: green;
        font-weight: bold;
    }

  </style>

</head>

<body>

<header>
  <h1>Library Management System</h1>
</header>

<div class="container">

  <div class="top">

    <h2>📚 Issue / Return Books</h2>

    <a href="/" class="button">
      ← Back to Home
    </a>

  </div>


  <!-- ISSUE BOOK -->

  <div class="card">

    <h2>Issue a Book</h2>

    <form action="/issue" method="post">

      <label>Book:</label>

      <select name="bookId" required>

        <option value="">Select Book</option>

        <option
                th:each="book : ${books}"
                th:value="${book.bookId}"
                th:text="${book.bookId + ' - ' + book.title + ' (Available: ' + book.availableQuantity + ')'}">
        </option>

      </select>


      <label>Member:</label>

      <select name="memberId" required>

        <option value="">Select Member</option>

        <option
                th:each="member : ${members}"
                th:value="${member.memberId}"
                th:text="${member.memberId + ' - ' + member.name}">
        </option>

      </select>


      <button type="submit">
        Issue Book
      </button>

    </form>

  </div>


  <!-- ISSUED BOOKS -->

  <div class="card">

    <h2>Issued Books</h2>

    <table>

      <thead>

      <tr>

        <th>Issue ID</th>
        <th>Book ID</th>
        <th>Member ID</th>
        <th>Issue Date</th>
        <th>Return Date</th>
        <th>Action</th>

      </tr>

      </thead>


      <tbody>

      <tr th:each="issue : ${issues}">

        <td th:text="${issue.issueId}"></td>

        <td th:text="${issue.bookId}"></td>

        <td th:text="${issue.memberId}"></td>

        <td th:text="${issue.issueDate}"></td>

        <td>

                    <span
                            th:if="${issue.returnDate != null}"
                            class="returned"
                            th:text="${issue.returnDate}">
                    </span>

          <span
                  th:if="${issue.returnDate == null}">
                        Not Returned
                    </span>

        </td>

        <td>

          <form
                  th:if="${issue.returnDate == null}"
                  action="/return"
                  method="post">

            <input
                    type="hidden"
                    name="issueId"
                    th:value="${issue.issueId}">

            <button type="submit">
              Return
            </button>

          </form>

          <span
                  th:if="${issue.returnDate != null}"
                  class="returned">
                        Returned
                    </span>

        </td>

      </tr>

      </tbody>

    </table>

  </div>

</div>

</body>

</html>
