<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Members - Library Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f416b;
            color: white;
            padding: 35px 60px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            width: 80%;
            margin: 50px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            color: #1f416b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        th {
            background: #1f416b;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .button {
            background: #1f416b;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background: #163452;
        }
    </style>
</head>

<body>

<header>
    <h1>Library Management System</h1>
</header>

<div class="container">

    <div class="top">
        <h2>👥 Library Members</h2>

        <a href="/" class="button">← Back to Home</a>
    </div>

    <table>

        <thead>
        <tr>
            <th>Member ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="member : ${members}">
            <td th:text="${member.memberId}"></td>
            <td th:text="${member.name}"></td>
            <td th:text="${member.email}"></td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
