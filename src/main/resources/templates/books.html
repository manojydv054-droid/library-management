<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books - Library Management</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1e3a5f;
            color: white;
            padding: 20px 50px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top h2 {
            color: #1e3a5f;
        }

        .back {
            background: #1e3a5f;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        th {
            background: #1e3a5f;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>Library Management System</h1>
</header>

<div class="container">

    <div class="top">
        <h2>📚 Available Books</h2>

        <a href="/" class="back">
            ← Back to Home
        </a>
    </div>

    <table>

        <thead>
        <tr>
            <th>Book ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Available Quantity</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="book : ${books}">

            <td th:text="${book.bookId}"></td>

            <td th:text="${book.title}"></td>

            <td th:text="${book.author}"></td>

            <td th:text="${book.availableQuantity}"></td>

        </tr>

        <tr th:if="${#lists.isEmpty(books)}">
            <td colspan="4" class="empty">
                No books found in the library.
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
